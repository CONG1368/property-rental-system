name: CI

# 本仓库的 CI 只跑「不依赖运行中服务」的门禁：
#   A 段 静态铁律 + WCAG 对比度   B 段 双端类型检查 + ESM 产物校验
# 运行时回归（full-e2e / test-api.sh 等）需要 npm run dev 起前后端，
# 由开发者在本地执行 npm run test:regression，不在此流水线内。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  static-gate:
    name: 静态与类型门禁
    runs-on: ubuntu-latest
    env:
      # 门禁不需要 Electron 二进制与 Playwright 浏览器，跳过下载可省数分钟
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      # --ignore-scripts：跳过根 postinstall（会重复装子包）与 better-sqlite3 等原生编译，
      # 类型检查只需要 .d.ts，不需要编译产物
      - name: 安装根依赖
        run: npm ci --ignore-scripts

      - name: 安装前端依赖
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: 安装后端依赖
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: 静态门禁 + 类型检查（npm run test:static）
        run: npm run test:static
